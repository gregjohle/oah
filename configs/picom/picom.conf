# ============================================================================
# picom: compositor for the OAH session
#
# The Omarchy shell draws its panels as mostly transparent windows (the bar's
# window spans the screen; only its strip is painted), so OAH needs a
# compositor the way Omarchy needs Hyprland's renderer.
#
# Look matches upstream default/hypr/looknfeel.lua: rounding 0, no shadows,
# no blur. Hyprland's open/close animations are on the Deferred list.
# ============================================================================

backend = "glx";
vsync = true;
use-damage = true;

# --- Corners (upstream decoration.rounding = 0) ------------------------------
# toggle-corners.sh flips this value.
corner-radius = 0;

# --- Shadows (upstream decoration.shadow.enabled = false) --------------------
shadow = false;

# --- Blur (upstream decoration.blur.enabled = false) -------------------------
blur-background = false;

# --- Fading ------------------------------------------------------------------
# Off until Hyprland's animations are ported (see Deferred: animations).
fading = false;

# --- Opacity -----------------------------------------------------------------
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
